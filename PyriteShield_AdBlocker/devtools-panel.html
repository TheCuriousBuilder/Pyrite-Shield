<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyrite Shield DevTools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e8e8e8;
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
    }
    h1 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 span { background: linear-gradient(135deg, #e53e3e, #742a2a); width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat-card { background: #16213e; border: 1px solid #2d3748; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-label { font-size: 10px; text-transform: uppercase; color: #6c6e8a; letter-spacing: 0.05em; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; color: #ecc94b; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 8px 10px; font-size: 10px; text-transform: uppercase; color: #6c6e8a; border-bottom: 1px solid #2d3748; }
    td { padding: 6px 10px; border-bottom: 1px solid #1e2a45; font-size: 12px; }
    td.domain { color: #a0a0b8; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.count { color: #ecc94b; font-weight: 600; text-align: right; }
    .section-title { font-size: 13px; font-weight: 600; margin: 16px 0 8px; color: #48bb78; }
  </style>
</head>
<body>
  <h1><span>✦</span> Pyrite Shield DevTools Panel</h1>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Blocked</div>
      <div class="stat-value" id="totalBlocked">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Session</div>
      <div class="stat-value" id="sessionBlocked">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Rulesets</div>
      <div class="stat-value" id="rulesetsCount">6</div>
    </div>
  </div>
  <div class="section-title">🔝 Most Blocked Domains</div>
  <div style="max-height: 400px; overflow-y: auto;">
    <table id="domainTable">
      <thead><tr><th>Domain</th><th style="text-align:right">Blocked</th></tr></thead>
      <tbody id="domainBody"></tbody>
    </table>
  </div>
  <script src="devtools-panel.js"></script>
</body>
</html>
